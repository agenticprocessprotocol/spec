name: validate-schemas

# Validates every schema under /schemas/ against the JSON Schema 2020-12
# meta-schema, and verifies that:
#   - every file in examples/ passes the schema;
#   - every file in examples/invalid/ fails the schema;
#   - no published schema version directory has been modified.
#
# Required status check on PRs touching /schemas/.

on:
  pull_request:
    branches: [main]
    paths:
      - "schemas/**"
      - ".github/workflows/validate-schemas.yml"
      - ".github/scripts/validate_schemas.py"
      - ".github/scripts/common.py"
  push:
    branches: [main]
    paths:
      - "schemas/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-schemas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    name: Schema validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v6.0.3
        with:
          fetch-depth: 0  # need base ref to compare against for immutability check
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: .github/scripts
        run: pip install -r requirements.txt
      - name: Run schema validator
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/validate_schemas.py

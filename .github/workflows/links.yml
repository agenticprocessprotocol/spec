name: links

# Validates that internal and external links in markdown and HTML files
# resolve. Uses lychee because it handles both external (HTTP) and
# relative/internal links.
#
# Scheduled weekly to catch external-link rot without blocking PRs on
# transient network failures.

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.html"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.html"
  schedule:
    - cron: "0 7 * * 1"  # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v6.0.3
      - name: Lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --verbose
            --accept 200,206,429
            --max-concurrency 8
            --timeout 20
            './**/*.md'
            './**/*.html'
          fail: true
      # Scheduled runs failing are visible via GitHub's standard workflow-run
      # notifications; no auto-issue action to add a third-party dependency.
